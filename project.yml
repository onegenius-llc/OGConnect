name: OGConnect
options:
  bundleIdPrefix: com.onegenius
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 34WADR9GR4
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OGConnect:
    type: application
    platform: iOS
    sources:
      - OGConnect
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onegenius.ogconnect
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: OGConnect/Info.plist
      properties:
        CFBundleDisplayName: OGConnect
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: OGConnect connects to the OGConnect Server app running on a Mac on your local network.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  OGConnectServer:
    type: application
    platform: macOS
    sources:
      - OGConnectServer
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onegenius.ogconnect.server
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: OGConnectServer/Info.plist
      properties:
        CFBundleDisplayName: OGConnect Server
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
